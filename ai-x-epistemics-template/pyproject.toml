[project]
name = "epistemics"
version = "0.1.0"
description = "Offline-first study runner for the AI x Epistemics research sprint."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
epistemics = "epistemics.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["epistemics*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
